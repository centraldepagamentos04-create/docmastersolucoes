<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pagamento | DocMaster Soluções</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonte premium -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0f172a;
      --secondary: #1e293b;
      --accent: #22c55e;
      --bg: #f8fafc;
      --text: #334155;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    /* FUNDO DESFOCADO */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          rgba(15, 23, 42, 0.55),
          rgba(15, 23, 42, 0.55)
        ),
        url("img/bg.jpg") center / cover no-repeat;
      filter: blur(10px);
      z-index: -1;
    }

    header {
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .container {
      max-width: 720px;
      margin: auto;
      padding: 24px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    .card {
      background: white;
      margin-top: 40px;
      padding: 40px;
      border-radius: 22px;
      box-shadow: 0 30px 60px rgba(0,0,0,.15);
      position: relative;
      z-index: 1;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
      color: var(--primary);
    }

    .price {
      font-size: 36px;
      font-weight: 900;
      color: var(--accent);
      margin: 20px 0;
    }

    .pix-box {
      background: #f9fafb;
      border: 2px dashed #bbf7d0;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      margin: 20px 0;
    }

    .btn {
      width: 100%;
      background: var(--accent);
      color: white;
      padding: 18px;
      border-radius: 14px;
      border: none;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      margin-top: 12px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(0,0,0,.2);
    }

    .muted {
      color: #64748b;
      font-size: 14px;
    }

    .confirm-link {
      display: block;
      margin-top: 30px;
      text-align: center;
      font-weight: 600;
      color: var(--secondary);
      text-decoration: none;
    }

    .confirm-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .card {
        padding: 28px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="brand">DocMaster Soluções</div>
  </div>
</header>

<main class="container">
  <div class="card">
    <h1>Pagamento via PIX</h1>
    <p class="muted">
      Finalize o pagamento para iniciarmos a produção do seu documento.
    </p>

    <div class="price">R$ 57,90</div>

    <p class="muted">Chave PIX (Celular):</p>
    <div class="pix-box" id="pixKey">11911864889</div>

    <button class="btn" onclick="copiarPix()">
      COPIAR CHAVE PIX
    </button>

    <p class="muted" style="margin-top:20px;">
      Após a confirmação do pagamento, seu documento será entregue em até
      <strong>30 minutos</strong>.
    </p>

    <a class="confirm-link" href="confirmacao.html">
      Já realizei o pagamento
    </a>
  </div>
</main>

<script>
  function copiarPix() {
    navigator.clipboard.writeText("11911864889");
    alert("Chave PIX copiada com sucesso!");
  }
</script>

</body>
</html>
