<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamento | DocMaster Soluções</title>
  <style>
    :root{--azul:#0b5ed7;--azul-esc:#0a58ca;--cinza:#f5f7fb;--texto:#1f2937}
    *{box-sizing:border-box;font-family:Arial, Helvetica, sans-serif}
    body{margin:0;color:var(--texto);background:var(--cinza)}
    header{background:#fff;border-bottom:1px solid #e5e7eb}
    .container{max-width:900px;margin:0 auto;padding:20px}
    .brand{font-size:22px;font-weight:800;color:var(--azul)}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px}
    h1{margin:16px 0 8px}
    .price{font-size:28px;font-weight:900;color:var(--azul)}
    .pix-key{background:#f9fafb;border:1px dashed #c7d2fe;border-radius:10px;padding:12px;font-weight:700}
    .btn{background:var(--azul);color:#fff;border:none;padding:14px;border-radius:10px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
    .btn:hover{background:var(--azul-esc)}
    .muted{color:#6b7280;font-size:14px}
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="brand">DocMaster Soluções</div>
  </div>
</header>

<main class="container">
  <div class="card">
    <h1>Pagamento via PIX</h1>
    <p class="muted">Finalize o pagamento para iniciarmos a produção do seu documento.</p>

    <p class="price">R$ 57,90</p>

    <p class="muted">Chave PIX (Celular):</p>
    <div class="pix-key" id="pixKey">11911864889</div>

    <br>
    <button class="btn" onclick="copiarPix()">COPIAR CHAVE PIX</button>

    <p class="muted"><br>Após a confirmação do pagamento, seu documento será entregue em até <strong>30 minutos</strong>.</p>

    <br>
    <a class="btn" href="confirmacao.html">JÁ REALIZEI O PAGAMENTO</a>
  </div>
</main>

<script>
  function copiarPix(){
    navigator.clipboard.writeText("11911864889");
    alert("Chave PIX copiada com sucesso!");
  }
</script>

</body>
</html>
