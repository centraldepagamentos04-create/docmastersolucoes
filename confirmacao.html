<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Confirmação | DocMaster Soluções</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonte premium -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0f172a;
      --secondary: #1e293b;
      --accent: #22c55e;
      --bg: #f8fafc;
      --text: #334155;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .container {
      max-width: 720px;
      margin: auto;
      padding: 24px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    .card {
      background: white;
      margin-top: 60px;
      padding: 50px 40px;
      border-radius: 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,.08);
      text-align: center;
    }

    .icon {
      font-size: 64px;
      color: var(--accent);
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      color: var(--primary);
    }

    .muted {
      color: #64748b;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .btn {
      background: var(--accent);
      color: white;
      padding: 16px 32px;
      border-radius: 14px;
      border: none;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(0,0,0,.15);
    }

    .message {
      margin-top: 24px;
      font-size: 15px;
      color: #16a34a;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .card {
        padding: 36px 24px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="brand">DocMaster Soluções</div>
  </div>
</header>

<main class="container">
  <div class="card">
    <div class="icon">✔</div>

    <h1>Documento entregue</h1>

    <p class="muted">
      Se você já recebeu seu documento em PDF por e-mail ou WhatsApp,
      confirme o recebimento abaixo.
    </p>

    <button class="btn" onclick="confirmarRecebimento()">
      CONFIRMAR RECEBIMENTO
    </button>

    <div id="mensagem" class="message"></div>
  </div>
</main>

<script>
  function confirmarRecebimento() {
    document.getElementById("mensagem").innerText =
      "Recebimento confirmado com sucesso. Obrigado pela confiança!";
  }
</script>

</body>
</html>
