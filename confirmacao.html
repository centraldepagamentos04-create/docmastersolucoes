<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmação | DocMaster Soluções</title>
  <style>
    :root{--azul:#0b5ed7;--azul-esc:#0a58ca;--cinza:#f5f7fb;--texto:#1f2937}
    *{box-sizing:border-box;font-family:Arial, Helvetica, sans-serif}
    body{margin:0;color:var(--texto);background:var(--cinza)}
    header{background:#fff;border-bottom:1px solid #e5e7eb}
    .container{max-width:700px;margin:0 auto;padding:20px}
    .brand{font-size:22px;font-weight:800;color:var(--azul)}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:30px;text-align:center}
    h1{margin:10px 0}
    .btn{background:var(--azul);color:#fff;border:none;padding:16px 24px;border-radius:12px;font-weight:900;cursor:pointer}
    .btn:hover{background:var(--azul-esc)}
    .ok{font-size:48px;color:var(--azul)}
    .muted{color:#6b7280}
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="brand">DocMaster Soluções</div>
  </div>
</header>

<main class="container">
  <div class="card">
    <div class="ok">✔</div>
    <h1>Documento entregue</h1>
    <p class="muted">
      Caso você já tenha recebido seu PDF por e-mail ou WhatsApp,
      confirme o recebimento abaixo.
    </p>

    <br>
    <button class="btn" onclick="confirmar()">CONFIRMAR RECEBIMENTO DO DOCUMENTO</button>

    <p id="mensagem" class="muted"></p>
  </div>
</main>

<script>
  function confirmar(){
    document.getElementById("mensagem").innerText =
      "Recebimento confirmado com sucesso. Obrigado!";
  }
</script>

</body>
</html>
