<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pedido | DocMaster Soluções</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonte premium -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0f172a;
      --secondary: #1e293b;
      --accent: #22c55e;
      --bg: #f8fafc;
      --text: #334155;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .container {
      max-width: 620px;
      margin: auto;
      padding: 24px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    .card {
      background: white;
      margin-top: 40px;
      padding: 40px;
      border-radius: 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 28px;
      color: var(--primary);
    }

    p.subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
      margin-top: 18px;
      display: block;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      margin-top: 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 15px;
      transition: border .2s, box-shadow .2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34,197,94,.2);
    }

    .btn {
      width: 100%;
      margin-top: 30px;
      background: var(--accent);
      color: white;
      padding: 18px;
      border-radius: 14px;
      border: none;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(0,0,0,.15);
    }

    .secure {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      .card {
        padding: 28px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="brand">DocMaster Soluções</div>
  </div>
</header>

<main class="container">
  <div class="card">
    <h1>Preencha seus dados</h1>
    <p class="subtitle">Informações necessárias para gerar seu documento em PDF</p>

    <form action="pagamento.html">

      <label>Nome completo</label>
      <input type="text" required>

      <label>CPF</label>
      <input type="text" required>

      <label>Cidade e Estado</label>
      <input type="text" required>

      <label>Nome do Hospital</label>
      <input type="text" required>

      <label>Endereço do Hospital</label>
      <input type="text" required>

      <label>Data e Hora</label>
      <input type="text" required>

      <label>Motivo (CID)</label>
      <input type="text" required>

      <label>Dias de Atestado</label>
      <input type="number" required>

      <label>WhatsApp para contato</label>
      <input type="text" required>

      <label>E-mail para entrega</label>
      <input type="email" required>

      <button class="btn" type="submit">
        CONTINUAR PARA PAGAMENTO
      </button>

    </form>

    <div class="secure">
      🔒 Seus dados estão protegidos e são usados apenas para gerar seu documento.
    </div>
  </div>
</main>

</body>
</html>
