<!DOCTYPE html>
<html lang="pt-BR">

<title>Pedido - DocMaster Soluções</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f9ff;

.container {
    max-width: 600px;

    background: white;
    padding: 30px;

    text-align: center;

    padding: 10px;

}
button {
